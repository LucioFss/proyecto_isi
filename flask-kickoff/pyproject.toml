[project]
name = "proyecto-isi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "salibamax2", email = "maximosaliba1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
proyecto-isi = "proyecto_isi:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/myapp"]
